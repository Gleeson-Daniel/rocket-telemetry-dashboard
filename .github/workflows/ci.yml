name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Transmitter build and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the C++ transmitter
        run: |
          cmake -S transmitter -B transmitter/build -DCMAKE_BUILD_TYPE=Release
          cmake --build transmitter/build

      - name: Run C++ packet tests
        run: ctest --test-dir transmitter/build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Fails rather than skips if the C++ binary is missing, so the
      # encoder/decoder cross-check can't silently drop out of CI.
      - name: Run pytest
        working-directory: backend
        run: |
          test -x ../transmitter/build/transmitter
          pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
